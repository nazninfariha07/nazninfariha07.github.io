<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fariha's Cozy Website</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Quicksand', sans-serif;
      background: #fdf6f0;
      color: #3a3a3a;
    }
    header {
      background: #f9e4d4;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    header h1 {
      margin: 0;
      font-size: 1.8rem;
    }
    nav a {
      margin-left: 1.5rem;
      text-decoration: none;
      color: #5e4b44;
      font-weight: 600;
    }
    .hero {
      padding: 4rem 2rem;
      text-align: center;
    }
    .hero img {
      border-radius: 50%;
      width: 150px;
      height: 150px;
      object-fit: cover;
      margin-bottom: 1rem;
      border: 3px solid #eadcd5;
    }
    .hero h2 {
      font-size: 2rem;
      margin: 0.5rem 0;
    }
    .hero p {
      max-width: 500px;
      margin: 0 auto;
      font-size: 1.1rem;
    }
    footer {
      text-align: center;
      padding: 2rem;
      font-size: 0.9rem;
      color: #a89b95;
    }
    .btn {
      background-color: #d9a5b3;
      color: white;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 25px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 1.5rem;
      text-decoration: none;
      display: inline-block;
    }
    .btn:hover {
      background-color: #c88fa2;
    }
  </style>
</head>
<body>
  <header>
    <h1>Fariha's Cozy Site</h1>
    <nav>
      <a href="#">Home</a>
      <a href="next.html">Next Page</a>
      <a href="more.html">More</a>
    </nav>
  </header>

  <section class="hero">
    <img src="cat.jpg" alt="Cozy Cat Picture" />
    <h2>Hello, I'm Fariha 🌸</h2>
    <p>Welcome to my cozy little corner of the internet. Grab a cup of tea and stay a while. ✨</p>
    <a href="next.html" class="btn">Go to Next Page</a>
    <br />
    <a href="more.html" class="btn">Visit More</a>
  </section>

  <footer>
    &copy; 2025 Fariha | All rights reserved
  </footer>
</body>
</html>
